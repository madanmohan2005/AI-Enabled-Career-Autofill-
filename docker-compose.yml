version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: careerfill-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: careerfill
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: careerfill-ai-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - EMBEDDING_MODEL_NAME=all-MiniLM-L6-v2

volumes:
  mysql_data:
